name: Build Bitcoin Paper Wallet

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  PATH: $ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

# 🔴 CHỈ CHẠY KHI BẠN BẤM NÚT — KHÔNG TỰ ĐỘNG
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK Thủ Công
    runs-on: ubuntu-latest

    steps:
      # ✅ BƯỚC 1: Tải & giải nén mã nguồn — KHÔNG CẦN TAR, KHÔNG DÙNG CHECKOUT
      - name: Tải mã nguồn từ GitHub
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          curl -sL "https://github.com/${REPO}/archive/refs/heads/${BRANCH}.zip" -o source.zip
          unzip -q source.zip
          # Di chuyển toàn bộ nội dung ra thư mục gốc
          FOLDER=$(unzip -l source.zip | head -5 | tail -1 | awk '{print $NF}')
          mv "${FOLDER}"/* .
          mv "${FOLDER}"/.git* . 2>/dev/null || true
          rm -rf "${FOLDER}" source.zip

      # ✅ BƯỚC 2: Cài JDK 11 — khớp build.gradle
      - name: Cài JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: 'gradle'

      # ✅ BƯỚC 3: Cài Android SDK — khớp compileSdk 37
      - name: Cài Android Command Line Tools & SDK
        run: |
          chmod +x gradlew
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076798_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm -f cmdline.zip
          # Cài SDK đúng phiên bản dự án
          yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools" >/dev/null
          sdkmanager --licenses >/dev/null 2>&1 || true

      # ✅ BƯỚC 4: Build APK
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      # ✅ BƯỚC 5: Chuẩn bị file kết quả
      - name: Đổi tên APK dễ nhận biết
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Không tìm thấy APK sau build"
            exit 1
          fi
          cp "$APK_PATH" "Bitcoin-Paper-Wallet-offline.apk"
          ls -la "Bitcoin-Paper-Wallet-offline.apk"

      # ✅ BƯỚC 6: Lưu APK ra sản phẩm tải về
      - name: Tải lên APK đã build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Paper-Wallet-APK
          path: Bitcoin-Paper-Wallet-offline.apk
          retention-days: 30
