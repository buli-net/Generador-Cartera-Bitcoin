name: Build Bitcoin Paper Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

# 🔴 CHỈ CHẠY KHI BẠN BẤM NÚT — KHÔNG TỰ ĐỘNG KHI PUSH/PR
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Xóa cache Gradle cũ (tránh xung đột)
        run: rm -rf ~/.gradle/caches

      # ✅ DÙNG ANDROID-34 (ANDROID 14) — ỔN ĐỊNH, CHẮC CHẮN TỒN TẠI
      # ❌ android-37 = Android 17 Preview ĐÃ BỊ GỠ KHỎI REPO CHÍNH
      - name: Setup Android SDK khớp dự án
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      # ✅ CHỈ GIỮ LẠI BUILD-TOOLS 34.0.0 DUY NHẤT → KHÔNG CÒN LỖI "Not a number"
      - name: Giữ lại build-tools 34.0.0 duy nhất
        run: |
          cd $ANDROID_HOME/build-tools
          for dir in *; do
            [ "$dir" = "34.0.0" ] || rm -rf "$dir"
          done
          ls -la

      - name: Cấp quyền thực thi gradlew
        run: chmod +x gradlew

      # ✅ BUILD APK
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      # ✅ ĐỔI TÊN VÀ KIỂM TRA FILE KẾT QUẢ
      - name: Đổi tên APK dễ nhận biết
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ LỖI: Không tìm thấy APK sau khi build"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          mv "$APK" Bitcoin-Paper-Wallet-offline.apk
          echo "✅ APK đã tạo thành công:"
          ls -lh Bitcoin-Paper-Wallet-offline.apk

      # ✅ TẢI LÊN ĐỂ BẠN TẢI VỀ
      - uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Paper-Wallet-APK
          path: Bitcoin-Paper-Wallet-offline.apk
          retention-days: 30
