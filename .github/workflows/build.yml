name: Build Bitcoin Paper Wallet

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  PATH: $ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK Thủ Công
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cài Android Command Line Tools & SDK
        run: |
          chmod +x gradlew
          # Tải cmdline-tools chuẩn mới nhất
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076798_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip
          # Cài các gói cần thiết khớp dự án
          yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
          sdkmanager --licenses || true

      - name: Thực thi build
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Đổi tên & chuẩn bị APK
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          mv "$APK" Bitcoin-Paper-Wallet-offline.apk
          echo "APK_PATH=Bitcoin-Paper-Wallet-offline.apk" >> $GITHUB_OUTPUT

      - name: Lưu APK làm sản phẩm
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Paper-Wallet-APK
          path: Bitcoin-Paper-Wallet-offline.apk
          retention-days: 30
