name: Build Bitcoin Paper Wallet

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

on:
  workflow_dispatch:  # 🔴 CHỈ CHẠY THỦ CÔNG — KHÔNG TỰ ĐỘNG

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Xóa cache cũ
        run: rm -rf ~/.gradle/caches

      # ✅ Dùng phiên bản cmdline-tools ổn định, CÒN TỒN TẠI trên Google
      - name: Setup Android SDK khớp dự án
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744  # ✅ Phiên bản chuẩn, không bị 404
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;37.0.0 platforms;android-37"

      # ✅ Giữ lại build-tools 37.0.0 duy nhất
      - name: Giữ lại build-tools 37.0.0
        run: |
          cd $ANDROID_HOME/build-tools
          for dir in *; do
            [ "$dir" = "37.0.0" ] || rm -rf "$dir"
          done

      - name: Cấp quyền gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          mv "$APK" Bitcoin-Paper-Wallet-offline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Paper-Wallet-APK
          path: Bitcoin-Paper-Wallet-offline.apk
          retention-days: 30
